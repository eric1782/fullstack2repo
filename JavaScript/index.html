<body>

    <div class="container mt-5 bg-white shadow-sm rounded">

        <h1 class="text-center text-primary mb-4"><i class="fa-brands fa-js"></i> </i>Clase 7 - Javascript desde 0</h1>
        <h4> Codigo embebido</h4>
        <pre>
            &lt;script&gt;
                alert("Hola desde Javascript");
            &lt;/script&gt;
        </pre>

        <h4> Usando Consola y Alert</h4>
        <button class="btn btn-outline-primary w-100 mb-3" onclick="mostrarMensajes()"><i class="fa-solid fa-play"></i>
            ejectutar mensajes
        </button>

        <h4>Variables y Tipos de Datos</h4>
        <div class="alert alert-info" id="tiposDatos"></div>

        <h4>Operaciones Basicas</h4>
        <div class="alert alert-light" id="operaciones"></div>

        <h4>Mini Formulario</h4>
        <form id="formularioContacto" action="#">

            <div class="mb-3">
                <label for="" class="form-label">Nombre</label>
                <input type="text" class="form-control" placeholder="Ej: Marcelo" id="nombre">
            </div>

            <div class="mb-3">
                <label for="" class="form-label">Correo electronico</label>
                <input type="email" class="form-control" placeholder="Ej: correo@dominio.cl" id="correo">
            </div>

            <button class="btn btn-success w-100" onclick="enviarFormulario()"><i class="fa-solid fa-paper-plane"></i>Enviar</button>

        </form>

        <div class="mt-3 d-none" id="mensajeResultado"></div>

    </div>
